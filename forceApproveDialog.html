<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 450px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 25px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    
    input[type="number"]:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    .help-text {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    
    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .icon {
      margin-right: 8px;
    }
    
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Forza Approvazione Richiesta</h1>
    <div class="subtitle">Approva una richiesta ignorando i limiti aziendali</div>
    
    <form id="forceForm">
      <div class="form-group">
        <label for="rowNumber">
          <span class="icon">📍</span>Numero di Riga
        </label>
        <input 
          type="number" 
          id="rowNumber" 
          name="rowNumber" 
          min="2" 
          placeholder="Es. 5"
          required
        >
        <div class="help-text">
          Inserisci il numero di riga dal foglio "Richieste" (minimo 2)
        </div>
      </div>
      
      <div class="form-group">
        <label for="reason">
          <span class="icon">📝</span>Motivazione
        </label>
        <textarea 
          id="reason" 
          name="reason" 
          placeholder="Es. Approvato per necessità urgente del reparto..."
        ></textarea>
        <div class="help-text">
          Spiega perché questa richiesta viene forzata (opzionale)
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn-secondary" onclick="google.script.host.close()">
          Annulla
        </button>
        <button type="submit" class="btn-primary" id="submitBtn">
          ✓ Forza Approvazione
        </button>
      </div>
    </form>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Elaborazione in corso...</p>
    </div>
    
    <div class="message" id="message"></div>
  </div>

  <script>
    // Gestione submit form
    document.getElementById('forceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      var rowNumber = parseInt(document.getElementById('rowNumber').value);
      var reason = document.getElementById('reason').value.trim();
      
      if (!rowNumber || rowNumber < 2) {
        showMessage('error', '⚠️ Inserisci un numero di riga valido (minimo 2)');
        return;
      }
      
      // Disabilita form e mostra loading
      setLoading(true);
      
      // Chiama la funzione server
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .forceApproveRequest(rowNumber, reason);
    });
    
    // Callback successo
    function onSuccess(result) {
      setLoading(false);
      
      if (result.success) {
        showMessage('success', '✓ ' + result.message);
        
        // Chiudi automaticamente dopo 3 secondi
        setTimeout(function() {
          google.script.host.close();
        }, 3000);
      } else {
        showMessage('error', '✗ ' + result.message);
      }
    }
    
    // Callback errore
    function onFailure(error) {
      setLoading(false);
      showMessage('error', '✗ Errore durante l\'operazione: ' + error.message);
    }
    
    // Mostra messaggio
    function showMessage(type, text) {
      var messageDiv = document.getElementById('message');
      messageDiv.className = 'message ' + type;
      messageDiv.innerHTML = text;
      messageDiv.style.display = 'block';
    }
    
    // Gestisce stato loading
    function setLoading(isLoading) {
      var form = document.getElementById('forceForm');
      var loading = document.getElementById('loading');
      var submitBtn = document.getElementById('submitBtn');
      
      if (isLoading) {
        form.style.display = 'none';
        loading.style.display = 'block';
        submitBtn.disabled = true;
      } else {
        form.style.display = 'block';
        loading.style.display = 'none';
        submitBtn.disabled = false;
      }
    }
    
    // Focus automatico sul primo campo
    window.addEventListener('load', function() {
      document.getElementById('rowNumber').focus();
    });
  </script>
</body>
</html>
